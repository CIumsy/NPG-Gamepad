name: Build NPG Lite SNES

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # lets you trigger manually from GitHub UI too

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Download and install ViGEmBus v1.22.0 silently
        run: |
          Invoke-WebRequest -Uri "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe" -OutFile "ViGEmBus_1.22.0_x64_x86_arm64.exe"
          Start-Process -FilePath ".\ViGEmBus_1.22.0_x64_x86_arm64.exe" -ArgumentList "/quiet", "/norestart" -Wait

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          Get-Content requirements.txt | Where-Object { $_ -notmatch "vgamepad" } | Set-Content requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install ./wheels/vgamepad-0.1.0-py3-none-any.whl
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller build.spec --clean

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/NPG Lite SNES.exe
